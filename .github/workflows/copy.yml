name: Copy

# Moojez's server builds and runs its images in a country Docker Hub refuses.
# GitHub's runners are not refused: they copy each image listed in images.txt,
# every platform and byte for byte (same digests), to this repository's
# packages on ghcr.io, which the server can reach. Weekly, so a base image's
# security fixes arrive without anyone asking, and on every change to the list.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Sign in to ghcr.io
        run: echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

      - name: Copy the images
        run: |
          target="ghcr.io/${GITHUB_REPOSITORY,,}"
          source_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          for image in $(grep -vE '^\s*(#|$)' images.txt); do
            echo "::group::${image}"
            # The source annotation links the package to this public
            # repository, so it is public too and pulled without a login.
            docker buildx imagetools create \
              --annotation "index:org.opencontainers.image.source=${source_url}" \
              --tag "${target}/${image}" "docker.io/${image}" \
              || { echo "::error::${image} was not copied"; exit 1; }
            echo "::endgroup::"
          done
